<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务看板</title>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface-2: #f1f2f4;
    --border: #e2e4e8;
    --text: #1c1e21;
    --muted: #666b74;
    --accent: #2f6fed;
    --accent-weak: #e8f0ff;
    --danger: #c0392b;
    --danger-weak: #fdecea;
    --warn: #9a5b00;
    --ok: #1f7a45;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    --radius: 9px;
    --gap: 14px;
  }
  html[data-theme="dark"] {
    --bg: #161819;
    --surface: #1f2224;
    --surface-2: #262a2d;
    --border: #33383d;
    --text: #e8eaed;
    --muted: #9aa1aa;
    --accent: #6f9bff;
    --accent-weak: #24324d;
    --danger: #ff8a80;
    --danger-weak: #3a2321;
    --warn: #f0b45f;
    --ok: #63c48d;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px clamp(12px, 3vw, 28px) 40px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; min-height: 20px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit;
    border-radius: 7px;
    padding: 6px 13px;
    min-height: 32px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    transition: background 120ms ease, border-color 120ms ease;
  }
  button:hover:not(:disabled) { background: var(--surface-2); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 10px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .stat b { display: block; font-size: 20px; font-weight: 650; line-height: 1.3; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.warn b { color: var(--warn); }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search { flex: 1 1 220px; min-width: 180px; }
  .search input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 11px;
    min-height: 34px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    min-height: 30px;
    font-size: 13px;
  }
  .chip[aria-pressed="true"] {
    background: var(--accent-weak);
    border-color: var(--accent);
    color: var(--text);
    font-weight: 600;
  }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); }
  .status { margin: 0; min-height: 20px; color: var(--muted); font-size: 13px; }
  .status[data-error="true"] { color: var(--danger); }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
    gap: var(--gap);
    align-items: start;
  }
  .column {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 96px;
  }
  .column-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px 2px;
  }
  .column-head h2 { font-size: 13px; margin: 0; font-weight: 650; }
  .column-head .count { color: var(--muted); font-size: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 10px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .card-title { font-weight: 600; word-break: break-word; }
  .card-notes {
    color: var(--muted);
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .tag {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 7px;
    line-height: 19px;
  }
  .tag.high { color: var(--danger); border-color: var(--danger); }
  .tag.due-over { color: var(--danger); border-color: var(--danger); }
  .card-actions { display: flex; gap: 6px; align-items: center; }
  .card-actions select {
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
    min-height: 28px;
  }
  .card-actions button { font-size: 12.5px; padding: 3px 9px; min-height: 28px; }
  .card-actions button.danger { color: var(--danger); border-color: var(--danger); }
  .card-actions button.danger.confirm { background: var(--danger-weak); }
  .empty {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
    background: var(--surface);
  }
  .empty p { margin: 0 0 12px; }
  .column-empty { color: var(--muted); font-size: 12.5px; padding: 6px 4px 2px; }
  dialog {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0;
    width: min(460px, calc(100vw - 32px));
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  form { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  form h2 { margin: 0; font-size: 16px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field textarea, .field select {
    font: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    min-height: 34px;
  }
  .field textarea { min-height: 74px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1 1 0; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 560px) {
    .bar { align-items: flex-start; }
    .actions { width: 100%; }
    .actions button { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<main>
  <header class="bar">
    <div>
      <h1>任务看板</h1>
      <p id="progress" class="sub">正在连接 Qoder…</p>
    </div>
    <div class="actions">
      <button id="send" type="button" hidden>同步到对话</button>
      <button id="refresh" type="button">刷新</button>
      <button id="new" type="button" class="primary">新建任务</button>
    </div>
  </header>

  <section id="stats" class="stats" aria-label="进度统计"></section>

  <section class="toolbar">
    <label class="search">
      <span class="sr-only">搜索任务标题或备注</span>
      <input id="query" name="q" type="search" placeholder="搜索标题或备注" autocomplete="off">
    </label>
    <div id="filters" class="chips" role="group" aria-label="按阶段筛选"></div>
    <label class="check"><input id="show-done" name="showDone" type="checkbox"> 显示已完成</label>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section id="board" class="board" aria-label="任务列"></section>
</main>

<dialog id="editor" aria-labelledby="editor-title">
  <form id="form" method="dialog">
    <h2 id="editor-title">新建任务</h2>
    <div class="field">
      <label for="f-title">标题</label>
      <input id="f-title" name="title" type="text" maxlength="200" required autocomplete="off">
    </div>
    <div class="field">
      <label for="f-notes">备注</label>
      <textarea id="f-notes" name="notes" maxlength="4000" placeholder="可选：补充说明、验收标准"></textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-stage">阶段</label>
        <select id="f-stage" name="stage">
          <option value="backlog">待开始</option>
          <option value="doing">进行中</option>
          <option value="review">待验收</option>
          <option value="done">已完成</option>
        </select>
      </div>
      <div class="field">
        <label for="f-priority">优先级</label>
        <select id="f-priority" name="priority">
          <option value="high">高</option>
          <option value="normal" selected>中</option>
          <option value="low">低</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-due">截止日期</label>
      <input id="f-due" name="due" type="date">
    </div>
    <div class="form-actions">
      <button id="cancel" type="button">取消</button>
      <button id="save" type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<script>
/* APP_SCRIPT */
</script>
</body>
</html>
